name: RetroTest CI

on:
  push:
    paths:
      - 'tools/emulators/retrotest/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/retrotest.yml'
  pull_request:
    paths:
      - 'tools/emulators/retrotest/**'
      - 'lib/**'
      - 'tests/**'

jobs:
  build-retrotest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build RetroTest
        working-directory: tools/emulators/retrotest
        run: make all

      - name: Upload RetroTest binary
        uses: actions/upload-artifact@v4
        with:
          name: retrotest-linux
          path: tools/emulators/retrotest/build/retrotest

  build-docker:
    runs-on: ubuntu-latest
    needs: build-retrotest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: tools/emulators/retrotest
        run: |
          docker build -t retrotest:latest -f docker/Dockerfile .

      - name: Test Docker image
        run: |
          docker run --rm retrotest:latest retrotest --help

      # Optionally push to registry
      # - name: Push to GitHub Container Registry
      #   if: github.ref == 'refs/heads/main'
